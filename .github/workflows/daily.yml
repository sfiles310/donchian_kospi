name: KOSPI Donchian Daily

on:
  schedule:
    # 07:30 UTC = 16:30 KST (장 마감 15:30 이후). 평일만.
    - cron: '30 7 * * 1-5'
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 신호 생성 (알림은 로컬 스케줄러 전용)
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING:     utf-8
        run: python donchian_kospi_daily.py

      - name: 대시보드를 Pages 산출물로 준비
        run: |
          mkdir -p _site
          cp output/dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
