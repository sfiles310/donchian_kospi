name: KOSPI Donchian Daily

on:
  schedule:
    # 07:40 UTC = 16:40 KST. 확정 시세로 대시보드를 갱신하고 로컬 실패 시 백업 발송.
    - cron: '40 7 * * 1-5'
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 신호 및 대시보드 생성
        env:
          TG_BOT_TOKEN:         ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:           ${{ secrets.TG_CHAT_ID }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING:     utf-8
          DEFER_FINALIZE:       '1'
        run: python donchian_kospi_daily.py

      - name: 대시보드를 Pages 산출물로 준비
        run: |
          mkdir -p _site
          cp output/dashboard.html _site/index.html
          # 알림 하단 링크가 가리키는 FTD 재진입 점검 화면
          cp output/ftd.html _site/ftd.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 배포된 대시보드와 동일한 데이터로 알림
        env:
          TG_BOT_TOKEN:         ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:           ${{ secrets.TG_CHAT_ID }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONIOENCODING:     utf-8
        run: python donchian_kospi_daily.py --finalize
