<title>FTD 판정 검토 — 2026년 코스피</title>
<style>
  :root {
    --ground: #f6f7f9;
    --surface: #ffffff;
    --ink: #1a1f26;
    --muted: #69727e;
    --faint: #9aa3af;
    --line: #dde2e8;
    --accent: #a96a14;
    --accent-soft: rgba(169, 106, 20, 0.13);
    --down: #a8443a;
    --up: #2c7a5b;
    --up-soft: rgba(44, 122, 91, 0.13);
    --band: rgba(105, 114, 126, 0.10);
    --shade: rgba(168, 68, 58, 0.055);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #101317; --surface: #171b21; --ink: #e6eaf0; --muted: #8c95a2;
      --faint: #6a737f; --line: #262c34; --accent: #d8983a;
      --accent-soft: rgba(216, 152, 58, 0.17); --down: #d46a5e; --up: #4fa57f;
      --up-soft: rgba(79, 165, 127, 0.16); --band: rgba(140, 149, 162, 0.13);
      --shade: rgba(212, 106, 94, 0.07);
    }
  }
  :root[data-theme="dark"] {
    --ground: #101317; --surface: #171b21; --ink: #e6eaf0; --muted: #8c95a2;
    --faint: #6a737f; --line: #262c34; --accent: #d8983a;
    --accent-soft: rgba(216, 152, 58, 0.17); --down: #d46a5e; --up: #4fa57f;
    --up-soft: rgba(79, 165, 127, 0.16); --band: rgba(140, 149, 162, 0.13);
    --shade: rgba(212, 106, 94, 0.07);
  }
  :root[data-theme="light"] {
    --ground: #f6f7f9; --surface: #ffffff; --ink: #1a1f26; --muted: #69727e;
    --faint: #9aa3af; --line: #dde2e8; --accent: #a96a14;
    --accent-soft: rgba(169, 106, 20, 0.13); --down: #a8443a; --up: #2c7a5b;
    --up-soft: rgba(44, 122, 91, 0.13); --band: rgba(105, 114, 126, 0.10);
    --shade: rgba(168, 68, 58, 0.055);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
      "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .num, table, .tile-value, .chip-value, .case-value {
    font-family: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas,
      "Liberation Mono", monospace;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 24px 72px;
    display: flex; flex-direction: column; gap: 32px; }

  header { display: flex; flex-direction: column; gap: 10px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; }
  h1 { margin: 0; font-size: clamp(24px, 3.4vw, 34px); font-weight: 640;
    letter-spacing: -0.021em; text-wrap: balance; line-height: 1.18; }
  .sub { margin: 0; color: var(--muted); max-width: 64ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip { display: inline-flex; align-items: baseline; gap: 7px;
    border: 1px solid var(--line); border-radius: 2px; padding: 5px 10px;
    background: var(--surface); font-size: 13px; }
  .chip-key { color: var(--muted); font-size: 11.5px; letter-spacing: 0.04em; }
  .chip-value { font-weight: 600; }
  .chip.is-wait { border-color: var(--accent); background: var(--accent-soft); }
  .chip.is-wait .chip-value { color: var(--accent); }

  .tiles { display: grid; gap: 1px; background: var(--line);
    border: 1px solid var(--line);
    grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); }
  .tile { background: var(--surface); padding: 16px 18px; display: flex;
    flex-direction: column; gap: 5px; }
  .tile-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; }
  .tile-value { font-size: 25px; font-weight: 620; letter-spacing: -0.015em; }
  .tile-note { font-size: 12.5px; color: var(--muted); }
  .tile-value.warn { color: var(--accent); }
  .tile-value.down { color: var(--down); }

  section { display: flex; flex-direction: column; gap: 14px; }
  h2 { margin: 0; font-size: 13px; font-weight: 660; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--muted);
    padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .panel { background: var(--surface); border: 1px solid var(--line);
    padding: 14px 8px 8px; }
  .scroller { overflow-x: auto; }
  svg { display: block; width: 100%; height: auto; min-width: 660px; }
  /* 범례 아이콘은 차트가 실제로 그리는 도형과 같은 SVG로 만든다.
     CSS로 흉내 내면 채운 원과 빈 원처럼 갈리는 곳에서 어긋난다. */
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px;
    color: var(--muted); padding: 8px 10px 2px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend svg { width: 18px; height: 14px; min-width: 0; flex: none; }

  .cases { display: grid; gap: 1px; background: var(--line);
    border: 1px solid var(--line);
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .case { background: var(--surface); padding: 16px 18px; display: flex;
    flex-direction: column; gap: 8px; }
  .case-head { display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; }
  .case-date { font-weight: 650; font-size: 15px; }
  .case-tag { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    font-weight: 660; padding: 2px 7px; border-radius: 2px; }
  .case-tag.win { color: var(--up); background: var(--up-soft); }
  .case-tag.none { color: var(--muted); background: var(--band); }
  .case-tag.wait { color: var(--accent); background: var(--accent-soft); }
  .case-grid { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px;
    font-size: 13px; }
  .case-grid dt { color: var(--muted); }
  .case-grid dd { margin: 0; }
  .case-value { font-weight: 600; }
  .case-note { font-size: 13px; color: var(--muted); }
  .case-edge { font-size: 20px; font-weight: 660; color: var(--up); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 640px; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); }
  th { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; }
  th:first-child, td:first-child { text-align: left; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.is-now { background: var(--accent-soft); }
  .pass { color: var(--up); font-weight: 600; }
  .fail { color: var(--down); }

  .notes { display: flex; flex-direction: column; gap: 9px; font-size: 14px;
    color: var(--muted); max-width: 76ch; }
  .notes p { margin: 0; }
  .notes b { color: var(--ink); font-weight: 620; }
  footer { font-size: 12.5px; color: var(--faint); border-top: 1px solid var(--line);
    padding-top: 16px; }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">KOSPI · 돈치안 20 · 오닐 FTD</div>
    <h1>FTD는 언제 뜨고, 돈치안보다 얼마나 빠른가</h1>
    <p class="sub">
      올해 FTD가 두 번 떴다. 하나는 이미 보유 중이라 소용없었고, 하나는 돈치안보다
      먼저 재진입 신호를 냈다. 그 뒤 7월 3일 매도 이후 지금까지는 아직 안 떴다.
    </p>
    <div class="chips" id="chips"></div>
  </header>

  <div class="tiles" id="tiles"></div>

  <section>
    <h2>올해 FTD 사례</h2>
    <div class="cases" id="cases"></div>
  </section>

  <section>
    <h2>지수 · 돈치안 20일 채널 · 신호 발생 지점</h2>
    <div class="panel">
      <div class="scroller"><svg id="main" viewBox="0 0 1000 420" role="img"
        aria-label="코스피 지수와 돈치안 채널, FTD 및 매매 신호 발생 지점"></svg></div>
      <div class="legend" id="legend"></div>

    <div class="panel">
      <div class="scroller"><svg id="gain" viewBox="0 0 1000 150" role="img"
        aria-label="일간 상승률과 2퍼센트 기준선"></svg></div>
    </div>

  <section>
    <h2>FTD 조건 ② 거래량 ÷ 50일 이동평균 — 기준 1.0배</h2>
    <div class="panel">
      <div class="scroller"><svg id="vol" viewBox="0 0 1000 150" role="img"
        aria-label="거래량 대 50일 이동평균 비율"></svg></div>
    </div>
  </section>

  <section>
    <h2>7월 3일 매도 이후 판정 창에 들어온 날</h2>
    <div class="panel scroller"><table id="judge"></table></div>
  </section>

  <section>
    <h2>읽는 법</h2>
    <div class="notes" id="notes"></div>
  </section>

  <footer id="foot"></footer>

<script>
const DATA = /*__DATA__*/;
const S = /*__SUMMARY__*/;
const NS = "http://www.w3.org/2000/svg";
const MONO = "ui-monospace, Consolas, monospace";

const fmt = (v, d = 0) => v == null || Number.isNaN(v)
  ? "—"
  : v.toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });
const signed = (v, d = 1) => (v > 0 ? "+" : "") + fmt(v, d);

function el(tag, attrs, parent) {
  const node = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}
/* halo를 켜면 글자 뒤에 배경색 테두리를 깔아 선 위에 얹혀도 읽힌다.
   paint-order로 획을 먼저 칠해야 글자가 두꺼워 보이지 않는다. */
function text(parent, x, y, content, opts = {}) {
  const { halo, ...rest } = opts;
  const attrs = Object.assign({
    x, y, fill: "var(--faint)", "font-size": 11, "font-family": MONO,
  }, rest);
  if (halo) {
    Object.assign(attrs, {
      stroke: "var(--surface)", "stroke-width": 3.6, "stroke-linejoin": "round",
      "paint-order": "stroke fill",
    });
  }
  const t = el("text", attrs, parent);
  t.textContent = content;
  return t;
}

/* 마커 도형. 차트와 범례가 같은 함수를 쓰므로 둘이 어긋날 수 없다.
   채운 원과 빈 원처럼 갈리는 곳에서 범례를 따로 만들면 반드시 틀어진다. */
const MARKERS = {
  sell: (svg, cx, cy) => el("circle", { cx, cy, r: 4.6, fill: "var(--down)",
    stroke: "var(--surface)", "stroke-width": 1.4 }, svg),
  buy: (svg, cx, cy) => el("circle", { cx, cy, r: 4.6, fill: "var(--surface)",
    stroke: "var(--ink)", "stroke-width": 2.2 }, svg),
  ftd: (svg, cx, cy) => el("path", {
    d: `M${cx} ${cy - 6.2} L${cx + 6} ${cy + 4.4} L${cx - 6} ${cy + 4.4} Z`,
    fill: "var(--up)", stroke: "var(--surface)", "stroke-width": 1.2 }, svg),
  today: (svg, cx, cy) => el("path", {
    d: `M${cx} ${cy - 6.2} L${cx + 6.2} ${cy} L${cx} ${cy + 6.2} L${cx - 6.2} ${cy} Z`,
    fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 1.4 }, svg),
};

const LEGEND = [
  { kind: "line", color: "var(--ink)", width: 2.2, label: "지수 종가" },
  { kind: "line", color: "var(--accent)", width: 1.9, label: "돈치안 상단 · 재진입선" },
  { kind: "line", color: "var(--muted)", width: 1.5, dash: "4 3", label: "돈치안 하단" },
  { kind: "marker", draw: MARKERS.ftd, label: "FTD 확정" },
  { kind: "marker", draw: MARKERS.buy, label: "돈치안 매수" },
  { kind: "marker", draw: MARKERS.sell, label: "돈치안 매도" },
  { kind: "marker", draw: MARKERS.today, label: "오늘 종가 (신호 아님)" },
  { kind: "area", color: "var(--shade)", label: "조정 국면" },
  { kind: "area", color: "var(--accent-soft)", label: "FTD 판정 창" },
];

function renderLegend() {
  const box = document.getElementById("legend");
  LEGEND.forEach((item) => {
    const row = document.createElement("span");
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 18 14");
    svg.setAttribute("aria-hidden", "true");
    if (item.kind === "line") {
      const line = el("line", { x1: 1, x2: 17, y1: 7, y2: 7, stroke: item.color,
        "stroke-width": item.width }, svg);
      if (item.dash) line.setAttribute("stroke-dasharray", item.dash);
    } else if (item.kind === "area") {
      el("rect", { x: 1, y: 2, width: 16, height: 10, fill: item.color }, svg);
    } else {
      item.draw(svg, 9, 7);
    }
    row.appendChild(svg);
    row.appendChild(document.createTextNode(item.label));
    box.appendChild(row);
  });
}

/* 연속된 조건 구간을 배경 띠로 그린다. */
function bands(svg, key, fill, x, top, height) {
  let start = null;
  DATA.forEach((row, i) => {
    const on = !!row[key];
    if (on && start === null) start = i;
    if ((!on || i === DATA.length - 1) && start !== null) {
      const end = on ? i : i - 1;
      el("rect", { x: x(start) - x.step / 2, y: top,
        width: x.step * (end - start + 1), height, fill }, svg);
      start = null;
    }
  });
}

function scaleX(count, left, right) {
  const step = (right - left) / count;
  const f = (i) => left + step * (i + 0.5);
  f.step = step;
  return f;
}

function drawMain() {
  const svg = document.getElementById("main");
  const [L, R, T, B] = [62, 986, 34, 376];
  const x = scaleX(DATA.length, L, R);
  const lo = Math.min(...DATA.map((r) => Math.min(r.low, r.dc_low))) * 0.985;
  const hi = Math.max(...DATA.map((r) => Math.max(r.high, r.dc_high))) * 1.015;
  const y = (v) => T + (hi - v) / (hi - lo) * (B - T);

  bands(svg, "in_correction", "var(--shade)", x, T, B - T);
  bands(svg, "in_window", "var(--accent-soft)", x, T, B - T);

  const step = (hi - lo) / 5;
  for (let i = 0; i <= 5; i++) {
    const v = lo + step * i;
    el("line", { x1: L, x2: R, y1: y(v), y2: y(v), stroke: "var(--line)",
      "stroke-width": 1 }, svg);
    text(svg, L - 9, y(v) + 4, fmt(v), { "text-anchor": "end" });
  }

  DATA.forEach((r, i) => {
    el("line", { x1: x(i), x2: x(i), y1: y(r.high), y2: y(r.low),
      stroke: "var(--band)", "stroke-width": Math.max(1.6, x.step * 0.48) }, svg);
  });

  const path = (key, stroke, width, dash) => {
    const d = DATA.map((r, i) =>
      `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(r[key]).toFixed(1)}`).join(" ");
    const p = el("path", { d, fill: "none", stroke, "stroke-width": width,
      "stroke-linejoin": "round" }, svg);
    if (dash) p.setAttribute("stroke-dasharray", dash);
  };
  path("dc_low", "var(--muted)", 1.3, "4 3");
  path("dc_high", "var(--accent)", 1.7, "");
  path("close", "var(--ink)", 2.1, "");

  /* 마커마다 이름을 붙이되 가격선에서 떼어 놓는다. 라벨은 마커에서 일정 거리
     밖으로 밀고 얇은 지시선으로 잇는다. 이미 놓인 라벨과 겹치면 더 민다.
     괄호 주석도 같은 목록에 등록해 마커 라벨이 그 자리를 피해 가게 한다. */
  const placed = [];
  function callout(cx, cyMarker, content, color, dir) {
    let offset = 20;
    const width = content.length * 7.4 + 8;
    for (let guard = 0; guard < 12; guard++) {
      const cy = cyMarker + dir * offset;
      const box = { x1: cx - width / 2, x2: cx + width / 2, y1: cy - 9, y2: cy + 4 };
      const clash = placed.some((p) =>
        box.x1 < p.x2 && box.x2 > p.x1 && box.y1 < p.y2 && box.y2 > p.y1);
      if (!clash) {
        placed.push(box);
        el("line", { x1: cx, x2: cx, y1: cyMarker + dir * 7, y2: cy - dir * 8,
          stroke: color, "stroke-width": 1, opacity: 0.5 }, svg);
        text(svg, cx, cy, content, { "text-anchor": "middle", fill: color,
          "font-size": 10.5, "font-weight": 700, halo: true });
        return;
      }
      offset += 14;
    }
  }

  /* 4월 사례: FTD 진입과 돈치안 진입 사이 구간을 묶어 차이를 보여준다. */
  const winner = S.events.find((e) => e.lagDays);
  if (winner) {
    const a = DATA.findIndex((r) => r.date === winner.date);
    const b = DATA.findIndex((r) => r.dc_buy && r.date > winner.date);
    if (a >= 0 && b > a) {
      const top = Math.max(T + 16, Math.min(y(DATA[a].close), y(DATA[b].close)) - 44);
      el("path", {
        d: `M${x(a)} ${y(DATA[a].close) - 9} L${x(a)} ${top} L${x(b)} ${top} L${x(b)} ${y(DATA[b].close) - 9}`,
        fill: "none", stroke: "var(--up)", "stroke-width": 1.3, opacity: 0.75,
      }, svg);
      const caption = `${winner.lagDays}거래일 먼저 · ${signed(winner.edgePct, 1)}% 싸게`;
      text(svg, (x(a) + x(b)) / 2, top - 7, caption,
        { "text-anchor": "middle", fill: "var(--up)", "font-size": 12,
          "font-weight": 700, halo: true });
      const half = caption.length * 4.2;
      placed.push({ x1: (x(a) + x(b)) / 2 - half, x2: (x(a) + x(b)) / 2 + half,
        y1: top - 18, y2: top + 4 });
    }
  }

  DATA.forEach((r, i) => {
    if (r.dc_sell) {
      MARKERS.sell(svg, x(i), y(r.close));
      callout(x(i), y(r.close), "매도", "var(--down)", -1);
    }
    if (r.dc_buy) {
      MARKERS.buy(svg, x(i), y(r.close));
      callout(x(i), y(r.close), "매수", "var(--ink)", -1);
    }
    if (r.ftd) {
      MARKERS.ftd(svg, x(i), y(r.close) + 17);
      callout(x(i), y(r.close) + 17, "FTD", "var(--up)", 1);
    }
  });

  const li = DATA.length - 1;
  el("line", { x1: x(li), x2: x(li), y1: y(DATA[li].close), y2: y(DATA[li].dc_high),
    stroke: "var(--accent)", "stroke-width": 1.4, "stroke-dasharray": "3 3" }, svg);
  text(svg, x(li) - 9, (y(DATA[li].close) + y(DATA[li].dc_high)) / 2,
    signed(S.gapToEntry, 1) + "%", { "text-anchor": "end", fill: "var(--accent)",
      "font-size": 12, "font-weight": 700, halo: true });
  MARKERS.today(svg, x(li), y(DATA[li].close));
  callout(x(li), y(DATA[li].close), "오늘", "var(--accent)", 1);

  axis(svg, x, B);
}

function axis(svg, x, B) {
  DATA.forEach((r, i) => {
    if (i % 14 && i !== DATA.length - 1) return;
    text(svg, x(i), B + 20, r.date.slice(5), { "text-anchor": "middle" });
  });
}

function drawBars(id, key, threshold, unit, zeroBase) {
  const svg = document.getElementById(id);
  const [L, R, T, B] = [62, 986, 12, 116];
  const x = scaleX(DATA.length, L, R);
  const values = DATA.map((r) => r[key]).filter((v) => v != null);
  const hi = Math.max(threshold * 1.2, ...values) * 1.06;
  const lo = zeroBase ? 0 : Math.min(0, ...values) * 1.12;
  const y = (v) => T + (hi - v) / (hi - lo) * (B - T);

  bands(svg, "in_window", "var(--accent-soft)", x, T, B - T);
  const base = y(0);
  DATA.forEach((r, i) => {
    const v = r[key];
    if (v == null) return;
    const ok = v >= threshold;
    el("rect", {
      x: x(i) - x.step * 0.34, y: Math.min(y(v), base),
      width: Math.max(1, x.step * 0.68), height: Math.max(1, Math.abs(y(v) - base)),
      fill: r.ftd ? "var(--up)" : ok ? "var(--up)" : (v < 0 ? "var(--down)" : "var(--faint)"),
      opacity: r.ftd ? 1 : r.in_window ? 0.9 : 0.34,
    }, svg);
  });
  el("line", { x1: L, x2: R, y1: base, y2: base, stroke: "var(--line)",
    "stroke-width": 1 }, svg);
  el("line", { x1: L, x2: R, y1: y(threshold), y2: y(threshold), stroke: "var(--accent)",
    "stroke-width": 1.4, "stroke-dasharray": "5 3" }, svg);
  text(svg, L - 9, y(threshold) + 4, threshold + unit, { "text-anchor": "end",
    fill: "var(--accent)", "font-weight": 700 });
  DATA.forEach((r, i) => {
    if (r.ftd) text(svg, x(i), T + 10, "▲", { "text-anchor": "middle",
      fill: "var(--up)", "font-size": 10 });
  });
  axis(svg, x, B);
}

function renderChips() {
  const items = [
    ["상태", "현금 보유", false],
    ["매도", S.sellDate + " · " + fmt(S.sellClose, 0), false],
    ["조정 국면", S.correctionStart + " 이후", false],
    ["랠리", S.rallyDay + "일차", false],
    ["FTD", "미확정 · 판정창 " + S.daysLeft + "일 남음", true],
  ];
  document.getElementById("chips").innerHTML = items.map(([k, v, wait]) =>
    `<span class="chip${wait ? " is-wait" : ""}"><span class="chip-key">${k}</span>` +
    `<span class="chip-value">${v}</span></span>`).join("");
}

function renderTiles() {
  const items = [
    ["현재 지수", fmt(S.close, 2), S.asOf + " 종가", ""],
    ["돈치안 재진입선", fmt(S.dcHigh, 2), "20일 채널 상단", "warn"],
    ["재진입까지", signed(S.gapToEntry, 1) + "%", "여기서 더 올라야 매수", "warn"],
    ["이번 저점", fmt(S.lowValue, 2), S.lowDate + " 장중", "down"],
    ["고점 대비", signed(S.dropFromPeak, 1) + "%", "올해 고점 기준", "down"],
  ];
  document.getElementById("tiles").innerHTML = items.map(([l, v, n, cls]) =>
    `<div class="tile"><span class="tile-label">${l}</span>` +
    `<span class="tile-value ${cls}">${v}</span>` +
    `<span class="tile-note">${n}</span></div>`).join("");
}

function renderCases() {
  const cards = S.events.map((e) => {
    const win = e.lagDays != null;
    const tag = win
      ? `<span class="case-tag win">돈치안보다 빨랐음</span>`
      : `<span class="case-tag none">효과 없음</span>`;
    const edge = win
      ? `<div class="case-edge">${e.lagDays}거래일 빠름 · ${signed(e.edgePct, 1)}% 유리</div>`
      : "";
    return `<div class="case">
      <div class="case-head"><span class="case-date">${e.date}</span>${tag}</div>
      <dl class="case-grid">
        <dt>지수</dt><dd class="case-value">${fmt(e.close, 2)}</dd>
        <dt>랠리 일차</dt><dd class="case-value">${e.rallyDay}일차</dd>
        <dt>상승률</dt><dd class="case-value">${signed(e.gain, 2)}%</dd>
        <dt>거래량</dt><dd class="case-value">${fmt(e.volRatio, 2)}배</dd>
      </dl>
      ${edge}
      <div class="case-note">${e.note}</div>
    </div>`;
  });
  if (!S.events.length) {
    cards.push(`<div class="case">
      <div class="case-head"><span class="case-date">판정 가능 구간</span>
        <span class="case-tag none">FTD 없음</span></div>
      <div class="case-note">${S.judgeFrom || "—"} 이후로 FTD가 뜬 날이 없다.
        거래량 자료가 그 앞으로는 없어 그 이전은 판정할 수 없다.</div>
    </div>`);
  }
  cards.push(`<div class="case">
    <div class="case-head"><span class="case-date">${S.asOf}</span>
      <span class="case-tag wait">판정 중</span></div>
    <dl class="case-grid">
      <dt>지수</dt><dd class="case-value">${fmt(S.close, 2)}</dd>
      <dt>랠리 일차</dt><dd class="case-value">${S.rallyDay}일차</dd>
      <dt>상승률</dt><dd class="case-value">${signed(S.gain, 2)}%</dd>
      <dt>거래량</dt><dd class="case-value">${fmt(S.volRatio, 2)}배</dd>
    </dl>
    <div class="case-note">상승률은 통과했지만 거래량이 기준 미달. 판정창
      ${S.daysLeft}거래일 남음.</div>
  </div>`);
  document.getElementById("cases").innerHTML = cards.join("");
}

function renderTable() {
  const rows = DATA.filter((r) => r.in_window && r.date >= S.sellDate);
  const head = "<thead><tr><th>일자</th><th>랠리 일차</th><th>종가</th>" +
    "<th>상승률</th><th>조건 ①</th><th>거래량 배수</th><th>조건 ②</th><th>판정</th></tr></thead>";
  const body = rows.map((r) => {
    const now = r.date === S.asOf ? ' class="is-now"' : "";
    const mark = (ok) => ok ? '<span class="pass">통과</span>' : '<span class="fail">미달</span>';
    return `<tr${now}><td class="num">${r.date}</td><td class="num">${r.rally_day}</td>` +
      `<td class="num">${fmt(r.close, 2)}</td><td class="num">${signed(r.gain, 2)}%</td>` +
      `<td>${mark(r.gain_ok)}</td><td class="num">${fmt(r.vol_ratio, 2)}배</td>` +
      `<td>${mark(r.volume_ok)}</td>` +
      `<td>${r.ftd ? '<span class="pass">FTD 확정</span>' : '<span class="fail">아님</span>'}</td></tr>`;
  }).join("");
  document.getElementById("judge").innerHTML = head + "<tbody>" + body + "</tbody>";
}

function renderNotes() {
  const winner = S.events.find((e) => e.lagDays);
  const maxVol = Math.max(...DATA.filter((r) => r.date >= S.sellDate).map((r) => r.vol_ratio));
  document.getElementById("notes").innerHTML = [
    winner ? `<p><b>4월 3일이 FTD가 실제로 일한 사례다.</b> 3월 31일 돈치안 매도 뒤
      지수가 더 빠졌고, 4월 3일 랠리 ${winner.rallyDay}일차에 상승 ${signed(winner.gain, 2)}%와
      거래량 ${fmt(winner.volRatio, 2)}배로 FTD가 떴다. 돈치안은 그로부터
      ${winner.lagDays}거래일 뒤에야 진입했고, 그사이 지수가 ${signed(winner.edgePct, 1)}%
      올라 있었다.</p>` : "",
    `<p><b>FTD는 현금일 때만 의미가 있다.</b> 보유 중에 조건이 충족돼도 추가로
      살 게 없다. 그래서 알림에도 현금 상태일 때만 이 블록이 나간다.</p>`,
    `<p><b>지금은 아직 안 떴다.</b> 재진입선이 ${fmt(S.dcHigh, 0)}이고 현재
      ${fmt(S.close, 0)}이라 돈치안으로는 ${signed(S.gapToEntry, 1)}% 더 올라야 한다.
      FTD 판정창은 ${S.daysLeft}거래일 남았다.</p>`,
    `<p><b>막고 있는 것은 거래량이다.</b> 7월 3일 매도 이후 거래량 배수가 1.0을 넘은
      날이 한 번도 없다. 최고가 ${fmt(maxVol, 2)}배였다. 지수가
      ${signed(S.dropFromPeak, 1)}% 빠지는 동안 거래가 붙지 않았다는 뜻이다.</p>`,
  ].join("");
}

function renderFoot() {
  const judged = S.judgeFrom
    ? ` 거래량 자료가 ${S.judgeFrom}부터라 FTD 판정은 그 이후 구간만 유효하다.` : "";
  document.getElementById("foot").textContent =
    `코스피 지수 · ${S.start} ~ ${S.asOf} ${S.days}거래일 ·` +
    ` 조정 정의는 250일 고점 대비 -10%, 판정창은 랠리 4~10일차, 상승 기준 2.0%,` +
    ` 거래량 기준은 50일 이동평균.${judged}` +
    ` 참고용 화면이며 매매 권유가 아니다.`;
}

renderChips();
renderTiles();
renderCases();
renderLegend();
drawMain();
drawBars("gain", "gain", 2.0, "%", false);
drawBars("vol", "vol_ratio", 1.0, "배", true);
renderTable();
renderNotes();
renderFoot();
</script>
